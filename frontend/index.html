<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PitchPulse — Guia da Copa do Mundo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f14; }
        .glass-panel { background: rgba(22, 27, 34, 0.6); backdrop-filter: blur(12px); }
        .active-sub-tab { background-color: #161b22; color: #10b981; border-color: rgba(16, 185, 129, 0.3); shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="text-slate-200 font-sans min-h-screen pb-12 selection:bg-emerald-500 selection:text-black">

    <header class="border-b border-slate-800 bg-[#0f141c]/90 sticky top-0 z-50 backdrop-blur-md shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500 text-slate-950 px-2.5 py-1 rounded font-black tracking-widest text-xs shadow-[0_0_20px_rgba(16,185,129,0.5)]">PULSE</div>
                <h1 class="text-sm font-mono font-bold tracking-wider text-white uppercase">PitchPulse <span class="text-emerald-400 text-xs lowercase">v3.0</span></h1>
            </div>
            <div id="status-api" class="text-[11px] font-mono text-slate-400 bg-[#161f28] border border-slate-800 px-3 py-1 rounded-sm">
                pinging_system...
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8 space-y-8">
        
        <section id="secao-ao-vivo" class="space-y-3" style="display:none">
            <div class="flex items-center space-x-2 font-mono text-xs tracking-widest uppercase text-slate-400">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_#ef4444]"></span>
                <span>[ Ao Vivo ]</span>
            </div>
            <div id="container-ao-vivo" class="w-full"></div>
        </section>

        <section class="glass-panel border border-slate-800/60 rounded-2xl overflow-hidden p-5 space-y-6 shadow-2xl">

            <div class="flex flex-wrap gap-2 bg-[#090d12] p-1.5 rounded-xl border border-slate-800/40">
                <button data-aba="copa2026" class="flex-1 min-w-[88px] py-2.5 px-3 text-xs font-mono tracking-wider uppercase rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer border border-transparent">
                    Copa 2026
                </button>
                <button data-aba="historia" class="flex-1 min-w-[88px] py-2.5 px-3 text-xs font-mono tracking-wider uppercase rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer border border-transparent">
                    História
                </button>
                <button data-aba="recordes" class="flex-1 min-w-[88px] py-2.5 px-3 text-xs font-mono tracking-wider uppercase rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer border border-transparent">
                    Recordes
                </button>
                <button data-aba="curiosidades" class="flex-1 min-w-[88px] py-2.5 px-3 text-xs font-mono tracking-wider uppercase rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer border border-transparent">
                    Curiosidades
                </button>
                <span class="w-px self-stretch bg-slate-800/60 mx-1 hidden sm:block"></span>
                <button data-aba="grupos" class="flex-1 min-w-[80px] py-2.5 px-3 text-xs font-mono tracking-wider uppercase rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer border border-transparent">
                    Tabela
                </button>
                <button data-aba="confrontos" class="flex-1 min-w-[80px] py-2.5 px-3 text-xs font-mono tracking-wider uppercase rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer border border-transparent">
                    Agenda
                </button>
                <button data-aba="chaveamento" class="flex-1 min-w-[80px] py-2.5 px-3 text-xs font-mono tracking-wider uppercase rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer border border-transparent">
                    Chaveamento
                </button>
            </div>

            <div id="conteudo-principal" class="w-full min-h-[250px]"></div>

        </section>

    </main>

    <script src="./scripts/dados-copa.js?v=4"></script>
    <script src="./scripts/enciclopedia.js?v=4"></script>
    <script src="./scripts/ao-vivo.js?v=4"></script>
    <script src="./scripts/grupos.js?v=4"></script>
    <script src="./scripts/confrontos.js?v=4"></script>
    <script src="./scripts/chaveamento.js?v=4"></script>
    <script src="./scripts/app.js?v=4"></script>
</body>
</html>
